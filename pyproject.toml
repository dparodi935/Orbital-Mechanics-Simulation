[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astro-tools"
version = "0.1.0"
description = "Set of tools for astrodynamics, from calculators, porkchop plot generators, to orbital simulations"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "astroquery==0.4.11", 
    "jplephem==2.24", 
    "matplotlib==3.11.2", 
    "numpy==2.5.3", 
    "pandas==3.0.6", 
    "PyYAML==6.0.3", 
    "scipy==1.18.1", 
    "tqdm==4.70.1", 
]

[project.scripts]
porkchop = "astro_tools.cli.porkchop_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/astro_tools"]